<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon — shown in browser tab AND in Google search results.
         Google re-crawls to pick up a changed favicon (can take days/weeks). -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" href="/logo.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- Primary SEO -->
    <title>Torta CRM — run your online store from one place</title>
    <meta name="description" content="Torta CRM is one platform to run your online store — orders, bookings, live customer chat, email campaigns and analytics, without juggling a dozen tools. Start free, no credit card." />
    <link rel="canonical" href="https://tortacrm.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0071E3" />

    <!-- Open Graph — link previews (Telegram, WhatsApp, Slack, Facebook…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Torta CRM" />
    <meta property="og:title" content="Torta CRM — run your online store from one place" />
    <meta property="og:description" content="Orders, bookings, live chat, email campaigns and analytics in one platform. Start free, no credit card." />
    <meta property="og:url" content="https://tortacrm.com/" />
    <meta property="og:image" content="https://tortacrm.com/logo.svg" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Torta CRM — run your online store from one place" />
    <meta name="twitter:description" content="Orders, bookings, live chat, email campaigns and analytics in one platform. Start free, no credit card." />
    <meta name="twitter:image" content="https://tortacrm.com/logo.svg" />

    <!-- Structured data — helps Google understand the brand + product.
         (Sitelinks themselves are auto-generated by Google from site
         structure + the sitemap; they can't be declared here.) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Torta CRM",
          "url": "https://tortacrm.com/",
          "logo": "https://tortacrm.com/logo.svg"
        },
        {
          "@type": "SoftwareApplication",
          "name": "Torta CRM",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://tortacrm.com/",
          "description": "One CRM platform for online stores: orders, bookings, live chat, email campaigns and analytics.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        }
      ]
    }
    </script>

    <!-- FAQ structured data — eligible for FAQ rich results. MUST mirror the
         visible FAQ section (Pages/Landing/Faq.jsx); keep the two in sync. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        { "@type": "Question", "name": "What is Torta CRM?", "acceptedAnswer": { "@type": "Answer", "text": "Torta CRM is one platform to run an online store — products, orders, bookings, live customer chat, email campaigns and analytics — without juggling a dozen separate tools." } },
        { "@type": "Question", "name": "Is there a free plan?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Start free, no credit card required. Upgrade only when you need more projects, team members, or storage." } },
        { "@type": "Question", "name": "How is it different from using separate tools?", "acceptedAnswer": { "@type": "Answer", "text": "Instead of stitching together a store builder, a CRM, a help desk, an email tool and a spreadsheet, Torta runs all of it in one workspace with shared customer and order data." } },
        { "@type": "Question", "name": "Do I need a developer to set it up?", "acceptedAnswer": { "@type": "Answer", "text": "No — you run everything from the console. There is also a developer API and the torta-js SDK if you want to connect a custom storefront." } },
        { "@type": "Question", "name": "Is my data secure?", "acceptedAnswer": { "@type": "Answer", "text": "Yes. Two-key API security, per-project access control, DKIM-signed email and role-based permissions are wired in by default." } },
        { "@type": "Question", "name": "Can I get a refund?", "acceptedAnswer": { "@type": "Answer", "text": "Yes — a 14-day money-back guarantee on your first payment, one-time per organization. You keep access until the current period ends." } }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
