# Nginx config for serving the Vite SPA bundle.
#
# Key behaviours:
#   1. SPA fallback — `try_files $uri /index.html` so client-side routes
#      like /dashboard, /project/abc/products etc. serve index.html and
#      let React Router handle them (not 404s).
#   2. Cache headers — hashed assets (index-abc123.js) get 1-year cache
#      with `immutable`, but index.html is no-cache so a fresh deploy
#      reaches users immediately.
#   3. gzip on the wire — saves ~70% on JS/CSS payloads. brotli would be
#      better but isn't in nginx:alpine by default.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA routing ──
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Long-cache hashed assets ──
    # Vite emits assets/ with content-hashed filenames (index-abc123.js).
    # Safe to cache aggressively — a new build = a new filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Never cache the entry point ──
    # index.html references the hashed bundles; if it's cached, users
    # would keep loading the old bundle even after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Health check ──
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
